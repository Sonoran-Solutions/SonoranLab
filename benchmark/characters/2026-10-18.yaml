# game-native run target, these three references, PixelLab sheets for benchmark use only, A/B as a reduced floor.
# Decision record: docs/decisions/ADR-0007-phase1-game-native-target.md.
#
# This repo is PUBLIC; the game is private. No game art, palette values or generated images of these characters are
# committed here. Inputs and outputs live on local NVMe under ~/sonoranlab-work/benchmark/ (manifest hashes below).
# Re-create the inputs with:
#   uv run --no-project --with pillow python -I benchmark/tools/extract_refs.py ~/Projects/TwosAreUp \
#     ~/sonoranlab-work/benchmark/characters/2026-10-18
# and check manifest.json against inputs_manifest_sha256.

