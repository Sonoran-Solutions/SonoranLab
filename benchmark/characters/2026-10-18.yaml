generation:
  directions: [north, north-east, east, south-east, south]   # west side mirrored from east, as the game does
  background: "#ff00ff"         # flat key, absent from the palette; BiRefNet alpha where a track has it
  seeds:
    C: [1, 2, 3, 4]             # Track C pose-conditioned
    E: [1, 2, 3, 4]             # Track E Wan 2.2; ONE seed x ONE direction first (smoke) before any sweep
    A: [1, 2]                   # svntax floor baseline, reduced (owner, 2026-10-18)
    B: [1, 2]                   # per checkpoint (2750, 3000)
  smoke_first: true             # every track runs 1 char x 1 seed x 1 direction before its sweep

processing:                     # identical for every track within this date (DYL-71 owns the scripts)
  chain: [alpha_extract, pixeloe_kcentroid, palette_enforce, alpha_clean, register_per_clip, validate, contact]
  pixeloe: {mode: k-centroid, scale: 4}
  thresholds: calibrate_from_ground_truth   # DYL-71 measures the shipped clips, records the limits as an addendum
                                            # to this file BEFORE the first track row is scored, then they are frozen

usable_rubric:                  # a clip is usable only if every line is yes
  validator:
    - frame count equals the clip spec, every generated direction present
    - exact cell size; binary alpha; 0 off-palette pixels after enforcement; <= 64 colours per cell
    - lowest opaque row of the clip == cell - 4 (bbox_bottom for #3); no clipping at the cell border
    - foot slide and bbox drift within the calibrated ground-truth limits
  human:                        # reviewed at 1x (1 sprite px = 1 screen px, nearest) playing at clip fps, plus 4x contact
    - identity: face, hair, armour and colour blocking match the reference in every direction
    - every listed accessory survives in every direction, including north (back view)
    - correct facing per row; west-side mirrors read correctly
    - reads as the clip (a run, or #3 a hover) at its fps without popping; the loop closes
    - no baked VFX, background, sticker border or keyline; outline style matches the shipped sheets
  cleanup_minutes: stopwatch time in Aseprite/Pixelorama to reach all-yes; > 60 total for character 1 = track out
