# Twos Are Up — SonoranLab project profile
# Spec: docs/07-project-profile.md. Values measured from the game, not assumed (DYL-70, ADR-0007):
#   ~/Projects/TwosAreUp main @ ebf3272, assets/pixel/v0/characters/{characters.json,palette.png,SOURCE.md},
#   src/Game/PixelStandee.cs, scenes/PixelStandee.gdshader.
# This repo is public and the game is private: the palette is referenced by path + sha256, never pasted here.
# Schema: sonoranlab/profile.py (DYL-79). Check with `uv run sonoranlab profile check profiles/twos-are-up.yaml`
# (--no-path-check skips the palette file and the game checkout). Relative paths resolve against this file's directory.

id: twos-are-up
name: Twos Are Up
style: pixel

canvas:
  density_px_per_m: 62    # one pixel density for every character; a 1.8 m human stands 112-113 px
  cell: per_character     # square cells, multiple of 8, sized to the widest pose (game range 120-288)
  gen_scale: 4            # model canvas per frame = cell * 4 (184 -> 736); PixelOE downscale factor
  padding: 2              # >= 2 transparent px around the art in every cell
  sheet_layout: rows_by_direction   # 8 rows; column 0 = still, then clips in order (characters.json `start`)

palette:
  source: /home/dq/Projects/TwosAreUp/assets/pixel/v0/characters/palette.png   # 255x1 RGB, one shared palette
  sha256: bf66d0a9818689706fe4d1c1dff7680b6908d598c6a7921b1727f0c19bea8457
  colours: 255
  max_colors_per_cell: 64 # measured 30-56 per cell across 21 shipped sheets
  dither: none

anchor:
  mode: foot              # foot | rig | bbox_bottom
  foot_y: cell_minus_4    # lowest opaque row of the clip = cell - 4 (3 empty rows below; engine pivot 3 px up)
  anchor_x: cell_half     # quad is centred horizontally
  registration: per_clip  # the game pivots each clip once (contact frames on foot_y); frames keep their bob

processing:               # the per-frame chain of `sonoranlab process` (DYL-86); values and their reasons are
  version: processing-v1  # benchmark/characters/2026-10-18-processing-v1.yaml (the Phase 1 sweep's frozen config)
  downscaler: k_centroid  # PixelOE k-centroid, pixeloe==1.0.0 torch backend on CPU
  thickness: 0            # PixelOE outline expansion; 0 round-trips shipped pixel art exactly (DYL-77)
  despill_px: 2           # magenta key spill removed within 2 HD px of the matte edge; interior untouched
  key_tol: 48             # chroma-key RGB distance to bg_key for frames without alpha
  # Not here: the colour cap is palette.max_colors_per_cell, the alpha threshold is alpha.threshold, and the pixelize
  # scale is inferred per input as raw frame edge / cell (must be an exact integer; Phase 1 track E raw = cell x 3).

alpha:
  threshold: 128
  bg_key: "#ff00ff"       # generation background; asserted absent from the palette by benchmark/tools/extract_refs.py
  fringe_passes: 1
  fringe_tolerance: 0     # shipped sheets have 0 semi-transparent pixels

outline:
  colour: "#110d0c"       # 1 px near-black selective outline (some dark hue-shifted variants), no anti-aliasing
  baked_border: forbidden # the white sticker border and #0e0b0a keyline are drawn by PixelStandee.gdshader

directions:
  order: [north, north-west, west, south-west, south, south-east, east, north-east]   # sheet row order
  generate: [north, north-east, east, south-east, south]
  mirror_animations: {north-west: north-east, west: east, south-west: south-east}     # stills stay true 8-dir
  mirror_right_from_left: false   # superseded by mirror_animations (the game mirrors west from east)

animations:               # names, frame counts and fps as the game's characters.json uses them
  idle:    {frames: 4, fps: 5,  loop: true,  track_default: E}   # ADR-0004: E leads locomotion and the hover idle
  run:     {frames: 6, fps: 10, loop: true,  track_default: E, template: ../templates/poses/run}   # ADR-0004 lead
  attack:  {frames: 8, fps: 12, loop: false, track_default: C}   # ADR-0004 held poses; unverified until Phase 6
  cast:    {frames: 8, fps: 10, loop: false}
  death:   {frames: 6, fps: 8,  loop: false, hold_last: true}
  channel: {frames: 8, fps: 8,  loop: false, loop_from: 4}
  # no walk or hurt clip exists; per-character overrides go under `characters:` (only for characters SonoranLab
  # generates; the game's characters.json stays the source for the rest, e.g. cleric death 8)

validator:                # defaults for any character without a row below; no threshold is ever unset
  label: calibrated `all` row (DYL-71, 2026-10-18.yaml thresholds_addendum.all); bbox drift 25 from ADR-0008 H4
  max_foot_slide_px: 30   # gates: generated clips may not move more than the shipped art
  max_bbox_drift_px: 25   # ADR-0008 H4: was 16 (one clip), which failed 4 of 13 shipped runs; 25 = observed max of the
                          # 13 shipped runs, benchmark/results/2026-10-19-phase2/validator-study.md
  opaque_area_cv_warn: 0.13       # warnings
  loop_closure_ratio_warn: 1.29

# Numbers only. Cells and clip frames match the game's characters.json (and benchmark/characters/2026-10-18.yaml).
# Gates (foot slide, bbox drift) and anchor_mode: benchmark/characters/2026-10-18-processing-v1.yaml `characters`.
# Warnings: 2026-10-18.yaml thresholds_addendum.per_character under its confirmed rule, cv = max(observed, 0.10).
characters:
  samurai:
    cell: 184
    anchor_mode: foot
    animations: {run: {frames: 7}}
    max_foot_slide_px: 30
    max_bbox_drift_px: 16
    opaque_area_cv_warn: 0.11
    loop_closure_ratio_warn: 1.18
  oathguard:
    cell: 176
    anchor_mode: foot
    max_foot_slide_px: 20
    max_bbox_drift_px: 8
    opaque_area_cv_warn: 0.13
    loop_closure_ratio_warn: 1.17
  relay_sentinel:         # floats: no run clip, its hover idle stands in for locomotion (ADR-0007)
    cell: 136
    anchor_mode: bbox_bottom
    locomotion: idle
    max_foot_slide_px: 15         # kept for the record; not computed or gated for bbox_bottom (ADR-0008 F2)
    max_bbox_drift_px: 10
    opaque_area_cv_warn: 0.10     # observed 0.01, raised to the docs/08 floor by the confirmed rule
    loop_closure_ratio_warn: 1.29
    # ADR-0008 F2: no foot_slide for bbox_bottom; hover warnings per direction instead (validator-study.md, shipped idle)
    hover_x_drift_warn_px: 3      # core centre x range > shipped max 3
    hover_min_bob_px: 1.5         # centroid y range < half the shipped minimum 3.11

references:
  style_refs: [samurai, oathguard, relay_sentinel]   # benchmark refs, see benchmark/characters/2026-10-18.yaml
  proportions: "realistic, ~7-7.5 heads, 62 px/m"
  outline: "1px near-black selective outline, no AA, no baked sticker border"
  camera: "side-view (eye level) 8-direction standees on leaning billboards under a 3D orbit camera"
  vfx: forbidden          # spell washes / specks were re-rolled out of shipped sheets; effects are shaders

export:
  godot_project: /home/dq/Projects/TwosAreUp
  sprites_dir: "res://assets/pixel/v0/characters"
  manifest: characters.json   # one PNG sheet + one manifest entry per character; no SpriteFrames .tres

autonomy:
  allow_auto_approve: false
  max_seeds_per_attempt: 4
  max_attempts_per_animation: 3
  escalate_after: ask
