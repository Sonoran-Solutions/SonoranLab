[project]
name = "sonoranlab"
version = "0.1.0"
description = "Local, deterministic pixel-sprite pipeline: profile, pixelize, palette, register, validate, Godot export."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pillow>=11.0",
    "pyyaml>=6.0",
    "pixeloe==1.0.0",
    "torch>=2.4",
    "torchvision>=0.19",  # pixeloe dependency; pinned to the CPU index with torch so the builds match
]

[project.scripts]
sonoranlab = "sonoranlab.cli:main"

[dependency-groups]
dev = ["pytest>=9.0", "ruff>=0.14"]

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

# torch/torchvision come from the CPU wheel index only (offline CPU runtime; pixeloe is their only user).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py311"
# Phase 0/1 tooling (benchmark/, env/, tools/, tests/ops, tests/benchmark) predates the ruff gate and is left as is.
include = ["sonoranlab/**/*.py", "tests/sonoranlab/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
